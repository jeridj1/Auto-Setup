# N.O.M.A.D. Debian 13 (Trixie) unattended installation profile.
# Loaded only by the explicit N.O.M.A.D. boot-menu entry.
# All disk destruction is blocked by the partman early-command approval gate.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
# Fully offline install: no DHCP probing, network prompts, or network timeouts.
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string nomad-e93z
d-i netcfg/get_domain string local
d-i netcfg/hostname string nomad-e93z

d-i hw-detect/load_firmware boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string America/Los_Angeles
d-i clock-setup/ntp boolean false

d-i passwd/root-login boolean false
d-i passwd/root-password-crypted password !
d-i passwd/make-user boolean true
d-i passwd/user-fullname string N.O.M.A.D. Operator
d-i passwd/username string nomad
d-i passwd/user-password-crypted password !
d-i passwd/user-default-groups string audio cdrom video sudo plugdev netdev

d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean true
d-i cdrom-detect/eject boolean false

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/choose_partition select finish
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i base-installer/install-recommends boolean true
tasksel tasksel/first multiselect standard, xfce-desktop
d-i pkgsel/include string sudo openssh-server
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# The target disk is selected dynamically by the single approval gate.
d-i partman/early_command string /bin/sh /cdrom/nomad/nomad-confirm-target.sh
# Do not add a fixed partman-auto/disk value here.

d-i preseed/late_command string /bin/sh /cdrom/nomad/late-command.sh
d-i finish-install/reboot_in_progress note
